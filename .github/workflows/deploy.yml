# Builds and deploys the site to Cloudflare Pages on every push to main.
# (Cloudflare's own Git integration never picked up pushes for this repo,
# so GitHub does the deploying instead.)
#
# Needs two repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   – token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  – shown in the Cloudflare dashboard sidebar / URL
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you click "Run workflow" in the Actions tab

concurrency:
  group: deploy-production
  cancel-in-progress: true # a newer push replaces an older one still deploying

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test # don't deploy if the scoring/seed tests fail
      - run: npm run build

      - name: Upload to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=projectrmt --branch=main --commit-hash=${{ github.sha }}
